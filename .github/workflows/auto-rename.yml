name: Auto Rename Tiryaq → Tiryaq

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - '**/rename**'
      - '**/chore**'

permissions:
  contents: write
  pull-requests: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Rename namespaces & use (all tracked PHP except vendor/)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PHP_FILES < <(git ls-files -z "*.php" | grep -vzZ "^vendor/")
          if [ ${#PHP_FILES[@]} -gt 0 ]; then
            # 1) namespace Tiryaq\X → namespace Tiryaq\X
            printf '%s\0' "${PHP_FILES[@]}" | xargs -0 perl -pi -e 's/^namespace\s+Tiryaq\\/namespace Tiryaq\\/;'
            # 2) use Tiryaq\… → use Tiryaq\…
            printf '%s\0' "${PHP_FILES[@]}" | xargs -0 perl -pi -e 's/\buse\s+Tiryaq\\/use Tiryaq\\/g;'
            # 3) أي FQN داخل السطور \Tiryaq\… → \Tiryaq\…
            printf '%s\0' "${PHP_FILES[@]}" | xargs -0 perl -pi -e 's/([^A-Za-z0-9_\\])Tiryaq\\/${1}Tiryaq\\/g;'
          fi

      - name: Update composer.json safely
        shell: bash
        run: |
          set -euo pipefail
          if [ -f composer.json ]; then
            TMP=composer.tmp.json
            jq '
              .name = "tiryaq/api"
              | .type = "tiryaq-package"
              | .autoload = (.autoload // {})
              | .autoload."psr-4" = {"Tiryaq\\Api\\":"src/"}
              | .extra = (.extra // {})
              | .extra.laravel = (.extra.laravel // {})
              | .extra.laravel.providers = ["Tiryaq\\Api\\Providers\\ApiServiceProvider"]
              | .replace = (.replace // {})
              | .replace["Tiryaq/api"] = "self.version"
            ' composer.json > "$TMP" && mv "$TMP" composer.json
          fi

      - name: Show diff summary
        run: |
          echo "Changed files:"
          git status --porcelain
          echo
          echo "Namespace counts (after):"
          grep -Rno --exclude-dir=vendor '\bnamespace Tiryaq\\' || true
          grep -Rno --exclude-dir=vendor '\buse Tiryaq\\' || true

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "refactor: rename Tiryaq→Tiryaq namespaces + composer.json"
          else
            echo "No changes to commit."
          fi

      - name: Push to branch
        run: |
          # ادفع على فرع ثابت للـ PR عشان المراجعة
          TARGET_BRANCH="chore/auto-rename"
          git branch -f "$TARGET_BRANCH"
          git push origin "$TARGET_BRANCH" -f

      - name: Create / Update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/auto-rename
          title: "refactor: rename Tiryaq → Tiryaq (auto)"
          body: |
            Automated namespace & composer rename from **Tiryaq** to **Tiryaq**.
            - Renamed all `namespace Tiryaq\*` / `use Tiryaq\*` (excluding vendor/)
            - Updated `composer.json` (name/type/autoload/providers/replace)
          labels: enhancement, automated
